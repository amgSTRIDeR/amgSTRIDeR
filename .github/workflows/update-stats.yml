name: Update GitHub Calendar Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate GitHub-style calendar
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USERNAME: amgSTRIDeR
        run: node .github/scripts/generate-calendar.mjs

      - name: Commit and push updated README
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Update GitHub-style calendar" || echo "No changes"
          git push