name: Update GitHub Calendar Stats

permissions:
  contents: write

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - run: npm install

      - name: Generate GitHub Stats
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USERNAME: amgSTRIDeR
        run: node .github/scripts/generate-calendar.js

      - name: Update LeetCode Stats
        env:
          LEETCODE_USERNAME: amgSTRIDeR
        run: node .github/scripts/update-leetcode-stats.js

      - name: Download LeetCode SVG badge
        run: |
          curl -sSL "https://leetcode-badge-showcase.vercel.app/api?username=amgstrider&animated=true&theme=dark" -o docs/thumbnails/leetcode.svg

      - name: Commit and push updated README and SVG
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add README.md docs/stats.svg docs/thumbnails/technology-stack.svg docs/thumbnails/leetcode.svg
          git commit -m "Update GitHub-style calendar and languages" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main